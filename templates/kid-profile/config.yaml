# =============================================================================
# Kid profile — builder mode (seed)
# =============================================================================
# This file is the template `hermes kid-setup` copies into a child's profile at
# ~/.hermes/profiles/<kid>/config.yaml.
#
# CAPABILITY MODEL: the child gets FULL builder powers — websites, games, apps,
# code execution, files, terminal, browser — the same tools an adult has. The
# guardrail is CONTENT, not capability: the persona (SOUL.md + agent.personalities)
# refuses age-inappropriate material (sexual, graphically violent, occult/cult)
# and keeps web search on safe mode.
#
# SAFETY NOTE: the content guardrail is the model's instructions (cooperative),
# NOT a hard technical wall. With full web/terminal/file access this is best-
# effort. Pair it with OS/network controls (macOS Screen Time -> Web Content ->
# Limit Adult Websites; a family DNS filter) and adult supervision. See
# docs/kid-mode.md.

# -----------------------------------------------------------------------------
# Tools — full toolset on every platform (the desktop GUI uses the `cli` key).
# -----------------------------------------------------------------------------
platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  discord: [hermes-discord]
  whatsapp: [hermes-whatsapp]
  slack: [hermes-slack]
  signal: [hermes-signal]
  homeassistant: [hermes-homeassistant]

# -----------------------------------------------------------------------------
# Agent behavior
# -----------------------------------------------------------------------------
agent:
  # Room to actually build things across a few turns.
  max_turns: 60

  # Builder persona overlay. The FIRM content boundaries live in SOUL.md.
  personalities:
    kid: >
      You are a warm, encouraging coding-and-building helper for a curious child
      (around 10). Help them build websites, games, and apps, write and run code,
      and modify this computer like a grown-up — explain simply, step by step, and
      say what you're about to do before changing important files or settings.
      Keep ALL content family-friendly: never sexual, graphically violent, or
      occult/cult material, consistent with the family's Christian values; keep
      web search on safe mode. Gently redirect if a request drifts there.

# Activate the builder/child persona for this profile.
display:
  personality: kid

# -----------------------------------------------------------------------------
# Model — placeholder. `hermes kid-setup` runs /free-llm-kid, which fills this
# in (free-tier cloud, local Ollama fallback, or an inherited parent key) and
# writes the matching key into this profile's .env.
# -----------------------------------------------------------------------------
# model:
#   provider: "nvidia"          # or "groq" / "gemini" / "custom" (local Ollama)
#   default: "<model-id>"
#   base_url: "<endpoint>/v1"
