# Build (and, when secrets are present, sign + notarize) the Hermes Desktop
# installers for macOS, Windows, and Linux, and publish them to a GitHub Release.
#
# Signing is OPT-IN via repo secrets — the workflow builds UNSIGNED today and
# starts signing the moment the certificates are added. See
# docs/kid-mode-distribution.md for the certificate/account prerequisites.
#
#   macOS signing + notarization:
#     CSC_LINK                  base64-encoded Developer ID Application .p12
#     CSC_KEY_PASSWORD          password for that .p12
#     APPLE_API_KEY             base64 (or path) of the App Store Connect API .p8
#     APPLE_API_KEY_ID          the key id
#     APPLE_API_ISSUER          the issuer id
#   Windows Authenticode signing:
#     WIN_CSC_LINK              base64-encoded code-signing .pfx
#     WIN_CSC_KEY_PASSWORD      password for that .pfx
#
# When a secret is absent, electron-builder skips that signing step (and
# scripts/notarize.cjs no-ops notarization), so CI stays green unsigned.

name: Build & sign installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create/append the GitHub Release

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            dist: dist:mac
          - os: windows
            runner: windows-latest
            dist: dist:win
          - os: linux
            runner: ubuntu-latest
            dist: dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Workspace install from the repo root (links apps/desktop, web, shared).
      - name: Install workspace dependencies
        run: npm ci

      - name: Build ${{ matrix.os }} installers
        working-directory: apps/desktop
        run: npm run ${{ matrix.dist }}
        env:
          # macOS Developer ID signing + notarization (skipped if unset).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows Authenticode signing (skipped if unset). electron-builder
          # reads WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD on Windows runners.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Let electron-builder skip publishing — this workflow uploads itself.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: warn

      # On a version tag, attach the installers to the GitHub Release.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          fail_on_unmatched_files: false
