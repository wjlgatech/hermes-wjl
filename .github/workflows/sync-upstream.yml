name: Sync with upstream Hermes

# Keeps this fork up to date with the official repo:
#   - main : fast-forwarded to NousResearch/hermes-agent@main (clean mirror)
#   - wjl  : upstream/main merged in (personal branch); on conflict an issue
#            is opened so you can resolve it manually.
#
# Runs daily and on manual dispatch (Actions tab -> Run workflow).

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/NousResearch/hermes-agent.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git + fetch upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main

      - name: Fast-forward main to upstream/main
        run: |
          git checkout main
          if git merge --ff-only upstream/main; then
            git push origin main
            echo "main fast-forwarded to upstream."
          else
            echo "::warning::main has diverged from upstream and cannot fast-forward; leaving it untouched."
          fi

      - name: Merge upstream/main into wjl
        id: mergewjl
        run: |
          git checkout wjl
          if git merge --no-edit upstream/main; then
            git push origin wjl
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/main into wjl."
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::Merge conflict — wjl left unchanged, opening an issue."
          fi

      - name: Open issue on conflict
        if: steps.mergewjl.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync conflict: resolve upstream/main -> wjl"
          # Avoid duplicate issues — reuse an open one if present.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body=$'The daily upstream sync could not merge `upstream/main` into `wjl` cleanly.\n\nResolve locally:\n```bash\ngit fetch upstream\ngit checkout wjl\ngit merge upstream/main   # resolve conflicts, commit\ngit push origin wjl\n```\n\n_(auto-filed by the Sync with upstream Hermes workflow)_'
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body" --label "upstream-sync" 2>/dev/null \
              || gh issue create --title "$title" --body "$body"
          else
            echo "Reusing open issue #$existing"
          fi
