name: Sync with upstream Hermes

# This fork's `main` is the personal DISTRIBUTION (current upstream Hermes +
# AG-UI + Cockpit + kid mode) that the desktop install tracks. Keep it current
# with the official repo by MERGING upstream/main into main hourly.
#
# Clean merge  -> push straight to main (installs pick it up).
# Conflict     -> DON'T touch main. Push the attempted merge (conflict markers
#                 committed) to a stable `auto-sync/upstream` branch, open/refresh
#                 ONE pull request into main, and FAIL the job so the run goes red.
#                 Issues are disabled on this fork, so a PR + red X is the signal
#                 — never the silent exit-0 the old version did.

on:
  schedule:
    - cron: "0 * * * *" # hourly — upstream Hermes is very active; keep main close
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/NousResearch/hermes-agent.git
  SYNC_BRANCH: auto-sync/upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git + fetch upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main

      - name: Merge upstream/main into main
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/main into main (clean)."
          else
            # Capture the conflicted tree (markers and all) so reviewers can
            # resolve it in the PR branch instead of re-deriving the merge.
            git add -A
            git commit --no-edit -m "Merge upstream/main into main (CONFLICTS — resolve before merging)"
            git branch -f "$SYNC_BRANCH" HEAD
            git push --force origin "$SYNC_BRANCH"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream merge conflict — main untouched; pushed to $SYNC_BRANCH."
          fi

      - name: Open / refresh sync PR on conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --state open --head "$SYNC_BRANCH" --base main --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Upstream sync conflict: resolve $SYNC_BRANCH into main" \
              --body $'The hourly upstream sync could not merge `upstream/main` into `main` cleanly.\n\nThis branch holds the attempted merge **with conflict markers committed**. Resolve them here (or locally), then merge this PR.\n\n```bash\ngit fetch origin\ngit checkout '"$SYNC_BRANCH"$'\n# resolve <<<<<<< / ======= / >>>>>>> markers, keeping fork features\ngit add -A && git commit && git push\n```\n\nThe branch is force-updated to the latest upstream every hour until merged.'
          else
            echo "PR #$existing already open — branch force-updated to latest upstream."
          fi

      - name: Fail the run so the conflict is visible
        if: steps.merge.outputs.result == 'conflict'
        run: |
          echo "::error::Upstream sync needs manual conflict resolution — see the open PR for $SYNC_BRANCH."
          exit 1
