name: Sync with upstream Hermes

# Keeps this fork up to date with the official repo:
#   - main : fast-forwarded to NousResearch/hermes-agent@main (clean mirror)
#   - wjl  : upstream/main merged in (personal branch); on conflict an issue
#            is opened so you can resolve it manually.
#
# Runs daily and on manual dispatch (Actions tab -> Run workflow).

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/NousResearch/hermes-agent.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git + fetch upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main

      - name: Fast-forward main to upstream/main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          if git merge --ff-only upstream/main; then
            git push origin main
            echo "main fast-forwarded to upstream."
          else
            echo "::warning::main has diverged from upstream and cannot fast-forward; leaving it untouched."
          fi

      # NOTE: the personal `wjl` branch is based on a much older Hermes and is
      # thousands of commits behind upstream, so an automatic merge would
      # conflict every run. We do NOT auto-merge it — instead we report the
      # drift so you know when a manual port is worth doing. To pull upstream
      # into wjl by hand:
      #   git fetch upstream && git checkout wjl && git merge upstream/main
      - name: Report how far wjl is behind upstream
        run: |
          git fetch origin wjl
          behind=$(git rev-list --count origin/wjl..upstream/main)
          ahead=$(git rev-list --count upstream/main..origin/wjl)
          echo "wjl is $behind commit(s) behind and $ahead ahead of upstream/main."
          echo "### Fork sync status" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`main\` mirrors upstream (auto fast-forwarded)." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`wjl\` is **$behind behind** / **$ahead ahead** of upstream/main (manual port)." >> "$GITHUB_STEP_SUMMARY"
