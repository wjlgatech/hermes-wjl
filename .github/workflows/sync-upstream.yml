name: Sync with upstream Hermes

# This fork's `main` is the personal DISTRIBUTION (current upstream Hermes +
# AG-UI + Cockpit) that the desktop install tracks. Keep it current with the
# official repo by MERGING upstream/main into main daily. On conflict, leave
# main untouched and open an issue so it can be resolved by hand.

on:
  schedule:
    - cron: "0 * * * *" # hourly — upstream Hermes is very active; keep main close
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/NousResearch/hermes-agent.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git + fetch upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
      - name: Merge upstream/main into main
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/main into main."
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream merge conflict — main left unchanged."
          fi
      - name: Open issue on conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync conflict: merge upstream/main into main"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          [ -z "$existing" ] && gh issue create --title "$title" \
            --body $'Daily upstream sync could not merge `upstream/main` into `main` cleanly.\n\nResolve:\n```bash\ngit fetch upstream\ngit checkout main\ngit merge upstream/main\ngit push origin main\n```' || echo "issue #$existing already open"
